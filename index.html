<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="side-bar">
            <div class="heading">
                <h1><img src="./SVG/dashboard.svg" alt="dashboard">Dashboard</h1>
            </div>
            <div class="upper">
                <div class="upper-options"><p><img src="./SVG/home.svg" alt="home" width="30px" height="30px"> Home</p></div>
                <div class="upper-options"><p><img src="./SVG/profile.svg" alt="prifile" width="30px" height="30px">Profile</p></div>
                <div class="upper-options"><p><img src="./SVG/message.svg" alt="messages" width="30px" height="30px">Messages</p></div>
                <div class="upper-options"><p><img src="./SVG/tasks.svg" alt="tasks" width="30px" height="30px">Tasks</p></div>
                <div class="upper-options"><p><img src="./SVG/history.svg" alt="history" width="30px" height="30px">History</p></div>
                <div class="upper-options"><P><img src="./SVG/community.png" alt="communities" width="30px" height="30px">Communities</P></div>
            </div>
            <div class="lower">
                <div class="lower-options"><p><img src="./SVG/setting.svg" alt="setting" width="30px" height="30px">Setting</p></div>
                <div class="lower-options"><p><img src="./SVG/support.svg" alt="support" width="30px" height="30px">Support</p></div>
                <div class="lower-options"><p><img src="./SVG/privacy.svg" alt="privacy" width="30px" height="30px">Privacy</p></div>
            </div>
        </div>
        <div class="content-area"></div>
    </div>
</body>
</html>
