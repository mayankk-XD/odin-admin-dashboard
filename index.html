<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="side-bar">
            <div class="heading">
                <h1><img src="./SVG/dashboard.svg" alt="dashboard">Dashboard</h1>
            </div>
            <div class="upper">
                <div class="upper-options"><p><img src="./SVG/home.svg" alt="home" "> Home</p></div>
                <div class="upper-options"><p><img src="./SVG/profile.svg" alt="prifile" ">Profile</p></div>
                <div class="upper-options"><p><img src="./SVG/message.svg" alt="messages" ">Messages</p></div>
                <div class="upper-options"><p><img src="./SVG/tasks.svg" alt="tasks" ">Tasks</p></div>
                <div class="upper-options"><p><img src="./SVG/history.svg" alt="history" ">History</p></div>
                <div class="upper-options"><P><img src="./SVG/community.png" alt="communities" width="30px" height="30px">Communities</P></div>
            </div>
            <div class="lower">
                <div class="lower-options"><p><img src="./SVG/setting.svg" alt="setting" ">Setting</p></div>
                <div class="lower-options"><p><img src="./SVG/support.svg" alt="support" ">Support</p></div>
                <div class="lower-options"><p><img src="./SVG/privacy.svg" alt="privacy">Privacy</p></div>
            </div>
        </div>
        <div class="content-area">
            <div class="header">
                <div class="search">
                    <img src="./SVG/search.svg" alt="search">
                    <input type="search" placeholder="Search...">
                </div>
                <div class="profile-small">
                    <img src="./SVG/notification.svg" alt="search">
                    <div>img</div>
                    <p>Morgen Okley</p>
                </div>
                <div class="profile-big">
                    <div class="pfp">img</div>
                    <div class="profile-info">
                        <div>
                            <p>Hi there,</p>
                            <h2>Morgan Oakley (@morgan)</h2>
                        </div>
                    </div>
                </div>
                <div class="options">
                    <button>New</button>
                    <button>Upload</button>
                    <button>Share</button>
                </div>
            </div>
            <div class="content">
                <div class="project-section">
                    <h3>Your Projects</h3>
                </div>
                <div class="other-secton">
                    <div class="announcement">
                        <h3>Announcement</h3>
                    </div>
                    <div class="trending">
                        <h3>Trending</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
